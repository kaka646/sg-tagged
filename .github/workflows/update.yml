name: Update tagged posts
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node update.js
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          HIDE: ${{ vars.HIDE }}
      - run: |
          git config user.name "sg-bot"
          git config user.email "sg-bot@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || git commit -m "Update tagged posts"
          git push
